<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace">
  <title>network-journal banner (dark)</title>
  <desc>Terminal-window banner: title bar with traffic-light dots, NETWORK JOURNAL wordmark, a stack status line, a prompt with a block cursor and an aligned packet hex dump; static 1280x340 artwork, dark palette.</desc>
  <rect id="bg" width="1280" height="340" fill="#0d1117"/>
  <rect id="win" x="40" y="36" width="1200" height="268" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <path id="bar" d="M52 36 H1228 A12 12 0 0 1 1240 48 V70 H40 V48 A12 12 0 0 1 52 36 Z" fill="#1b2129"/>
  <path d="M40 70 H1240" stroke="#30363d" stroke-width="1"/>
  <circle id="dot-r" cx="66" cy="53" r="5" fill="#f85149"/>
  <circle id="dot-y" cx="86" cy="53" r="5" fill="#d29922"/>
  <circle id="dot-g" cx="106" cy="53" r="5" fill="#3fb950"/>
  <text id="t-wintitle" x="640" y="57" text-anchor="middle" font-size="12" fill="#8b949e">network-journal - 0x0000 capture.pcapng</text>
  <text id="t-whoami" x="84" y="118" font-size="13.5"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3" dx="8">whoami</tspan></text>
  <text id="t-title" x="84" y="168" font-size="46" font-weight="700" letter-spacing="3" fill="#e6edf3">NETWORK JOURNAL</text>
  <text id="t-comment" x="84" y="198" font-size="13.5" fill="#8b949e">// follow the bytes, not the marketing</text>
  <text id="t-stack" x="84" y="226" font-size="13.5"><tspan fill="#3fb950">[ok]</tspan><tspan fill="#8b949e" dx="8">Ethernet / ARP / IPv4 / TCP / UDP / DNS / TLS / QUIC</tspan></text>
  <text id="t-prompt" x="84" y="258" font-size="14" fill="#3fb950">$</text>
  <rect id="cursor" x="101" y="244" width="8.5" height="16" fill="#3fb950"/>
  <text id="hd0a" x="728" y="112" font-size="13" fill="#58a6ff">0x0000</text>
  <text id="hd0b" x="834" y="112" font-size="13" fill="#39c5cf">45 00 00 3C</text>
  <text id="hd0m" x="968" y="112" font-size="13" fill="#e6edf3">IPv4 v4 ihl5 len60</text>
  <text id="hd0n" x="1126" y="112" font-size="13" fill="#8b949e">; ip</text>
  <text id="hd1a" x="728" y="138" font-size="13" fill="#58a6ff">0x0010</text>
  <text id="hd1b" x="834" y="138" font-size="13" fill="#39c5cf">C0 A8 00 05</text>
  <text id="hd1m" x="968" y="138" font-size="13" fill="#e6edf3">src 192.168.0.5</text>
  <text id="hd1n" x="1126" y="138" font-size="13" fill="#8b949e">; src</text>
  <text id="hd2a" x="728" y="164" font-size="13" fill="#58a6ff">0x0022</text>
  <text id="hd2b" x="834" y="164" font-size="13" fill="#39c5cf">1F 90 00 50</text>
  <text id="hd2m" x="968" y="164" font-size="13" fill="#e6edf3">port 8080 to 80</text>
  <text id="hd2n" x="1126" y="164" font-size="13" fill="#8b949e">; tcp</text>
  <text id="hd3a" x="728" y="190" font-size="13" fill="#58a6ff">0x0036</text>
  <text id="hd3b" x="834" y="190" font-size="13" fill="#39c5cf">02 04 05 B4</text>
  <text id="hd3m" x="968" y="190" font-size="13" fill="#e6edf3">opt MSS 1460</text>
  <text id="hd3n" x="1126" y="190" font-size="13" fill="#8b949e">; syn</text>
  <text id="hd4a" x="728" y="216" font-size="13" fill="#58a6ff">0x0054</text>
  <text id="hd4b" x="834" y="216" font-size="13" fill="#39c5cf">16 03 01 02</text>
  <text id="hd4m" x="968" y="216" font-size="13" fill="#e6edf3">TLS ClientHello</text>
  <text id="hd4n" x="1126" y="216" font-size="13" fill="#8b949e">; tls</text>
  <text id="hd5a" x="728" y="242" font-size="13" fill="#58a6ff">0x0088</text>
  <text id="hd5b" x="834" y="242" font-size="13" fill="#39c5cf">47 45 54 20</text>
  <text id="hd5m" x="968" y="242" font-size="13" fill="#e6edf3">GET / HTTP/1.1</text>
  <text id="hd5n" x="1126" y="242" font-size="13" fill="#8b949e">; http</text>
  <text id="hd6a" x="728" y="268" font-size="13" fill="#58a6ff">0x00C0</text>
  <text id="hd6b" x="834" y="268" font-size="13" fill="#39c5cf">00 01 00 01</text>
  <text id="hd6m" x="968" y="268" font-size="13" fill="#e6edf3">DNS A example.com</text>
  <text id="hd6n" x="1126" y="268" font-size="13" fill="#8b949e">; dns</text>
  <text id="t-footer" x="84" y="288" font-size="13"><tspan fill="#8b949e">[</tspan><tspan fill="#3fb950">&gt;</tspan><tspan fill="#8b949e">---------</tspan><tspan fill="#8b949e">]</tspan><tspan fill="#8b949e" dx="16">week 01-02</tspan><tspan fill="#8b949e" dx="16">|</tspan><tspan fill="#d29922" dx="16">running</tspan></text>
</svg>
